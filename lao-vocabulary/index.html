<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老挝语特定词汇知识库</title>
<meta name="description" content="老挝语特定词汇知识库：按分类检索汉语—老挝语专业术语。">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+Lao:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#f5f0e6;
    --surface:#fffdf8;
    --ink:#1c231f;
    --ink-2:#565e56;
    --ink-3:#8d938a;
    --line:#ded4c3;
    --line-soft:#ece4d5;
    --green:#1e4b3d;
    --green-2:#2e6a54;
    --gold:#b0863a;
    --gold-2:#d8bd8a;
    --mark:#f5e2b4;
    --shadow:0 12px 32px rgba(30,75,61,.10);
    --serif:"Noto Serif SC","Songti SC","SimSun",serif;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --lao:"Noto Sans Lao","Leelawadee UI","Phetsarath OT","Noto Sans SC",sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:400;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background-image:radial-gradient(rgba(30,75,61,.05) 1px,transparent 1px);
    background-size:24px 24px;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{width:min(1080px,calc(100% - 56px));margin:0 auto;}

  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    border-top:3px solid var(--green);
    border-bottom:1px solid var(--line);
    background:rgba(245,240,230,.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .topbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    height:64px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }
  .seal{
    width:38px;
    height:38px;
    flex:none;
    display:grid;
    place-items:center;
    background:var(--green);
    color:#f4ead4;
    font-family:var(--serif);
    font-size:19px;
    border-radius:3px;
    position:relative;
  }
  .seal::after{
    content:"";
    position:absolute;
    inset:3px;
    border:1px solid rgba(216,189,138,.55);
    border-radius:1px;
  }
  .brand-text b{
    display:block;
    font-family:var(--serif);
    font-size:15px;
    font-weight:600;
    letter-spacing:.06em;
  }
  .brand-text i{
    display:block;
    font-style:normal;
    font-size:10px;
    letter-spacing:.18em;
    color:var(--ink-3);
    text-transform:uppercase;
    margin-top:1px;
  }
  .top-meta{
    font-size:12px;
    color:var(--ink-3);
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .top-meta b{color:var(--green);font-weight:600;}

  /* ===== 首页 ===== */
  .hero{padding:62px 0 0;}
  .eyebrow{
    font-size:12px;
    letter-spacing:.2em;
    color:var(--gold);
  }
  .hero h1{
    font-family:var(--serif);
    font-size:clamp(31px,4.6vw,44px);
    font-weight:700;
    line-height:1.2;
    letter-spacing:.02em;
    margin-top:14px;
    max-width:820px;
  }
  .lede{
    margin-top:18px;
    max-width:640px;
    font-size:15px;
    font-weight:300;
    line-height:1.9;
    color:var(--ink-2);
  }

  .search{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:30px;
    max-width:760px;
    padding:7px 7px 7px 18px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 1px 0 rgba(30,75,61,.04);
    transition:border-color .18s,box-shadow .18s;
  }
  .search:focus-within{
    border-color:var(--green);
    box-shadow:0 0 0 4px rgba(30,75,61,.08);
  }
  .search-icon{flex:none;color:var(--ink-3);display:flex;}
  .search input{
    flex:1;
    min-width:0;
    border:0;
    outline:none;
    background:transparent;
    font:inherit;
    font-size:16px;
    color:var(--ink);
    padding:10px 0;
  }
  .search input::placeholder{color:#a4a99f;}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;}
  .clear{
    flex:none;
    display:grid;
    place-items:center;
    width:28px;
    height:28px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--ink-3);
    cursor:pointer;
  }
  .clear:hover{background:var(--line-soft);color:var(--ink);}
  .search .btn{
    flex:none;
    border:0;
    border-radius:3px;
    background:var(--green);
    color:#f8f2e4;
    font-size:15px;
    letter-spacing:.12em;
    padding:12px 28px;
    cursor:pointer;
    transition:background .18s;
  }
  .search .btn:hover{background:var(--green-2);}

  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:0;
    margin-top:30px;
    padding-top:18px;
    max-width:760px;
    border-top:1px solid var(--line);
  }
  .stat{
    padding-right:34px;
    margin-right:34px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:0;margin-right:0;padding-right:0;}
  .stat b{font-family:var(--serif);font-size:18px;color:var(--green);font-weight:600;}
  .stat span{font-size:12px;color:var(--ink-3);margin-left:7px;letter-spacing:.04em;}

  /* ===== 分类 ===== */
  .cats{padding-bottom:10px;}
  .sec-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin:58px 0 22px;
    padding-top:26px;
    border-top:1px solid var(--line);
  }
  .sec-head h2{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    letter-spacing:.04em;
  }
  .sec-hint{font-size:12px;color:var(--ink-3);letter-spacing:.05em;}
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:16px;
  }
  .cat-card{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:24px 24px 18px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    text-decoration:none;
    position:relative;
    overflow:hidden;
    transition:transform .22s,border-color .22s,box-shadow .22s;
  }
  .cat-card::before{
    content:"";
    position:absolute;
    left:-1px;
    top:-1px;
    width:70px;
    height:3px;
    background:var(--gold-2);
    transition:width .28s,background .28s;
  }
  .cat-card:hover{
    transform:translateY(-3px);
    border-color:var(--green);
    box-shadow:var(--shadow);
  }
  .cat-card:hover::before{width:calc(100% + 2px);background:var(--gold);}
  .cat-index{
    font-family:var(--serif);
    font-size:12px;
    letter-spacing:.22em;
    color:var(--gold);
  }
  .cat-card h3{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    letter-spacing:.02em;
    margin-top:2px;
  }
  .cat-card p{
    font-size:13.5px;
    font-weight:300;
    line-height:1.8;
    color:var(--ink-2);
    min-height:48px;
  }
  .cat-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:auto;
    padding-top:14px;
    border-top:1px dotted var(--line);
    font-size:12.5px;
    color:var(--ink-3);
  }
  .cat-go{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--green);
    font-weight:500;
  }
  .cat-go svg{transition:transform .22s;}
  .cat-card:hover .cat-go svg{transform:translateX(4px);}
  .pending{
    margin-top:18px;
    padding:14px 18px;
    border:1px dashed var(--line);
    border-radius:4px;
    background:rgba(255,253,248,.55);
    font-size:13px;
    color:var(--ink-3);
  }

  /* ===== 分类页 ===== */
  .crumbs{
    display:flex;
    align-items:center;
    gap:9px;
    padding-top:34px;
    font-size:12.5px;
    color:var(--ink-3);
  }
  .crumbs a{
    color:var(--green);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .crumbs a:hover{border-bottom-color:var(--green);}
  .cat-head{padding-top:20px;}
  .cat-kicker{
    font-family:var(--serif);
    font-size:11.5px;
    letter-spacing:.2em;
    color:var(--gold);
  }
  .cat-head h1{
    font-family:var(--serif);
    font-size:clamp(30px,4vw,40px);
    font-weight:700;
    letter-spacing:.03em;
    margin-top:10px;
  }
  .cat-desc{
    margin-top:12px;
    max-width:660px;
    font-size:14.5px;
    font-weight:300;
    line-height:1.85;
    color:var(--ink-2);
  }
  .cat-count{margin-top:12px;font-size:12.5px;color:var(--ink-3);}
  .cat-count b{font-family:var(--serif);font-size:16px;color:var(--green);font-weight:600;}

  .results{margin-top:34px;}

  .result-sum{
    padding-bottom:6px;
    font-size:13.5px;
    color:var(--ink-2);
  }
  .result-sum .q{color:var(--green);font-weight:500;}
  .result-sum b{font-family:var(--serif);font-size:16px;color:var(--green);}

  .group{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0 14px;
  }
  .group-name{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--green);}
  .group-count{
    font-size:11.5px;
    color:var(--gold);
    border:1px solid var(--gold-2);
    border-radius:99px;
    padding:1px 9px;
    line-height:1.6;
  }
  .group-line{flex:1;height:1px;background:var(--line);}

  .entries{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr));
    gap:10px;
  }
  .entry{
    padding:16px 20px 17px;
    background:var(--surface);
    border:1px solid var(--line-soft);
    border-radius:5px;
    transition:border-color .18s,background .18s;
  }
  .entry:hover{border-color:#bcd0c3;background:#fffef9;}
  .chip{
    display:inline-block;
    margin-bottom:7px;
    padding:1px 8px;
    font-size:11px;
    color:var(--green);
    background:#eaf0e8;
    border-radius:3px;
    letter-spacing:.04em;
  }
  .entry-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:7px;}
  .entry-meta .chip{margin-bottom:0;}
  .ftag{font-size:11px;color:#8a7350;letter-spacing:.03em;line-height:1.6;}
  .muted{color:#a89b85;font-weight:300;font-size:15px;}
  .entry-zh{
    font-family:var(--serif);
    font-size:20px;
    font-weight:600;
    line-height:1.5;
    letter-spacing:.01em;
  }
  .entry-lo{
    margin-top:4px;
    font-family:var(--lao);
    font-size:17px;
    line-height:1.75;
    color:var(--green);
    word-break:break-word;
  }
  mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px;}

  .more-wrap{text-align:center;margin:18px 0 8px;}
  .btn-more{
    padding:11px 26px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--green);
    font-size:13px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:background .18s,border-color .18s;
  }
  .btn-more:hover{border-color:var(--green);background:#f2f7f1;}

  .empty{padding:64px 0 44px;text-align:center;}
  .empty-icon{color:#c9bfae;margin-bottom:14px;}
  .empty h3{font-family:var(--serif);font-size:19px;font-weight:600;}
  .empty p{margin-top:9px;font-size:13.5px;color:var(--ink-3);}

  .back-home{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:34px;
    font-size:13px;
    color:var(--green);
    text-decoration:none;
  }
  .back-home:hover{text-decoration:underline;}

  /* ===== 页脚 ===== */
  .site-foot{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:10px;
    max-width:1080px;
    margin:74px auto 0;
    padding:22px 28px 42px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-3);
    letter-spacing:.03em;
  }

  /* ===== 响应式 ===== */
  @media (max-width:720px){
    .wrap{width:calc(100% - 36px);}
    .topbar-inner{height:58px;}
    .brand-text i{display:none;}
    .top-meta{display:none;}
    .hero{padding-top:44px;}
    .hero h1{font-size:29px;}
    .lede{font-size:14px;margin-top:14px;}
    .search{padding:6px 6px 6px 14px;gap:8px;}
    .search input{font-size:15px;padding:9px 0;}
    .search .btn{padding:11px 18px;font-size:14px;letter-spacing:.06em;}
    .stats{margin-top:26px;}
    .stat{padding-right:18px;margin-right:18px;}
    .sec-head{margin-top:44px;}
    .cat-card p{min-height:0;}
    .site-foot{margin-top:56px;padding:20px 18px 36px;}
    .entry-zh{font-size:18px;}
    .entry-lo{font-size:16px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/" aria-label="返回首页">
      <span class="seal" aria-hidden="true">老</span>
      <span class="brand-text">
        <b>老挝语特定词汇知识库</b>
        <i>Lao Terminology Library</i>
      </span>
    </a>
    <div class="top-meta" id="topMeta"></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<footer class="site-foot">
  <span id="footLeft"></span>
  <span>汉语 — 老挝语 术语对照</span>

    empty: '<svg class="empty-icon" viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="21" cy="21" r="12"/><path d="M30 30l8 8"/><path d="M17 21h8"/></svg>'
  };

  /* ---------- 工具 ---------- */
  function fmt(n){ return Number(n).toLocaleString("zh-CN"); }
  function esc(s){
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escAttr(s){ return esc(s); }
  function hi(text, q){
    var safe = esc(text);
    if (!q) return safe;
    var needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (!needle) return safe;
    return safe.replace(new RegExp("(" + needle + ")", "gi"), "<mark>$1</mark>");
  }
  function totalEntries(){
    return CATS.reduce(function (sum, c) { return sum + c.entries.length; }, 0);
  }
  function pad2(n){ return n < 10 ? "0" + n : String(n); }

  function rank(z, l, ql){
    var zl = String(z).toLowerCase();
    var ll = String(l).toLowerCase();
    if (zl === ql) return 100;
    var parts = zl.split("/");
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].trim() === ql) return 96;
    }
    if (zl.indexOf(ql) === 0) return 90;
    if (ll === ql) return 88;
    if (zl.indexOf(ql) > 0) return 78;
    if (ll.indexOf(ql) === 0) return 70;
    if (ll.indexOf(ql) > 0) return 62;
    return 0;
  }

  function byScore(a, b){
    if (b.s !== a.s) return b.s - a.s;
    if (a.z.length !== b.z.length) return a.z.length - b.z.length;
    return a.z.localeCompare(b.z, "zh");
  }

  function collect(cats, q, withCat){
    var ql = q.toLowerCase();
    var exact = [];
    var related = [];
    cats.forEach(function (cat, ci) {
      cat.entries.forEach(function (e) {
        var s = rank(e[0], e[1], ql);
        if (!s) return;
        var item = { z: e[0], l: e[1], f: e[2] || "", s: s, ci: ci, cat: withCat ? cat.name : "" };
        if (s >= 86) exact.push(item);
        else related.push(item);
      });
    });
    function sortItems(a, b){
      var r = byScore(a, b);
      return r !== 0 ? r : a.ci - b.ci;
    }
    exact.sort(sortItems);
    related.sort(sortItems);
    return { exact: exact, related: related };
  }

  /* ---------- 结构片段 ---------- */
  function searchForm(mode, q, placeholder){
    return '' +
      '<form class="search" data-search="' + escAttr(mode) + '" role="search">' +
        '<span class="search-icon" aria-hidden="true">' + ICON.search + '</span>' +
        '<input type="search" name="q" value="' + escAttr(q) + '" placeholder="' + escAttr(placeholder) + '" autocomplete="off" aria-label="检索词条">' +
        (q ? '<button type="button" class="clear" data-clear aria-label="清空检索词">' + ICON.close + '</button>' : '') +
        '<button type="submit" class="btn">查询</button>' +
      '</form>';
  }

  function cardHTML(item, q){
    var meta = (item.cat ? '<span class="chip">' + esc(item.cat) + '</span>' : '') +
      (item.f ? '<span class="ftag">' + esc(item.f) + '</span>' : '');
    var zh = item.z ? hi(item.z, q) : '<span class="muted">（空行）</span>';
    var lo = item.l ? hi(item.l, q) : '<span class="muted">（空行）</span>';
    return '' +
      '<article class="entry">' +
        (meta ? '<div class="entry-meta">' + meta + '</div>' : '') +
        '<h3 class="entry-zh">' + zh + '</h3>' +
        '<p class="entry-lo" lang="lo">' + lo + '</p>' +
      '</article>';
  }

  function listBlock(key, items, q){
    state.lists[key] = items;
    var shown = Math.min(PAGE, items.length);
    var html = '<div class="entries" data-list="' + key + '">';
    html += items.slice(0, shown).map(function (it) { return cardHTML(it, q); }).join("");
    html += '</div>';
    if (items.length > shown) {
      html += '<div class="more-wrap"><button type="button" class="btn-more" data-more="' + key + '" data-shown="' + shown + '">显示更多（还有 ' + fmt(items.length - shown) + ' 条）</button></div>';
    }
    return html;
  }

  function groupHead(name, count){
    return '<div class="group"><span class="group-name">' + name + '</span>' +
      '<span class="group-count">' + fmt(count) + '</span><span class="group-line"></span></div>';
  }

  function emptyHTML(q){
    return '' +
      '<div class="empty">' + ICON.empty +
        '<h3>没有找到「' + esc(q) + '」</h3>' +
        '<p>试试更短的关键词，或换用中文 / 老挝文再查一次。</p>' +
      '</div>';
  }

  function resultsHTML(res, q){
    var html = "";
    var total = res.exact.length + res.related.length;
    if (!total) return emptyHTML(q);
    html += '<div class="result-sum">检索 <span class="q">「' + esc(q) + '」</span> 共找到 <b>' + fmt(total) + '</b> 条词条</div>';
    if (res.exact.length) {
      html += groupHead("词条匹配", res.exact.length);
      html += listBlock("exact", res.exact, q);
    }
    if (res.related.length) {
      html += groupHead("相关词条", res.related.length);
      html += listBlock("related", res.related, q);
    }
    return html;
  }

  /* ---------- 视图：首页 ---------- */
  function renderHome(q){
    var html = "";
    html += '<section class="hero">';
    html += '<p class="eyebrow">汉语 — 老挝语 · 专业术语</p>';
    html += '<h1>老挝语特定词汇知识库</h1>';
    html += '<p class="lede">按分类进入对应词库，输入中文或老挝文即可定位术语；原词优先呈现，同义译法与相关词条一并列出。</p>';
    html += searchForm("global", q, "输入中文或老挝文，检索全部词条");
    if (!q) {
      html += '<div class="stats">';
      html += '<div class="stat"><b>' + fmt(CATS.length) + '</b><span>个分类</span></div>';
      html += '<div class="stat"><b>' + fmt(totalEntries()) + '</b><span>条词条</span></div>';
      html += '<div class="stat"><b>汉 · 老</b><span>双向检索</span></div>';
      html += '</div>';
    }
    html += '</section>';

    if (q) {
      html += '<section class="results">' + resultsHTML(collect(CATS, q, true), q) + '</section>';
      html += '<a class="back-home" href="#/">' + ICON.back + ' 返回分类词库</a>';
    } else {
      html += '<section class="cats">';
      html += '<div class="sec-head"><h2>分类词库</h2><span class="sec-hint">' + CATS.length + " / " + PLANNED + ' 个分类</span></div>';
      if (CATS.length) {
        html += '<div class="cat-grid">';
        CATS.forEach(function (cat, i) {
          html += '<a class="cat-card" href="#/c/' + encodeURIComponent(cat.id) + '">';
          html += '<span class="cat-index">分类 ' + pad2(i + 1) + '</span>';
          html += '<h3>' + esc(cat.name) + '</h3>';
          html += '<p>' + esc(cat.desc || "该分类收录的汉语—老挝语专业术语。") + '</p>';
          html += '<div class="cat-foot"><span>' + fmt(cat.entries.length) + ' 条词条</span>';
          html += '<span class="cat-go">进入检索 ' + ICON.arrow + '</span></div>';
          html += '</a>';
        });
        html += '</div>';
      }
      if (CATS.length < PLANNED) {
        html += '<p class="pending">其余 ' + (PLANNED - CATS.length) + ' 个分类的术语表添加后，会自动出现在这里。</p>';
      }
      html += '</section>';
    }
    view.innerHTML = html;
  }

  /* ---------- 视图：分类页 ---------- */
  function renderCategory(cat, q){
    var index = CATS.indexOf(cat) + 1;
    var html = "";
    html += '<nav class="crumbs"><a href="#/">全部分类</a><span>/</span><span>' + esc(cat.name) + '</span></nav>';
    html += '<header class="cat-head">';
    html += '<p class="cat-kicker">分类 ' + pad2(index) + ' / ' + pad2(PLANNED) + '</p>';
    html += '<h1>' + esc(cat.name) + '</h1>';
    if (cat.desc) html += '<p class="cat-desc">' + esc(cat.desc) + '</p>';
    html += '<p class="cat-count">本分类共 <b>' + fmt(cat.entries.length) + '</b> 条词条</p>';
    html += '</header>';
    html += searchForm(cat.id, q, "在「" + cat.name + "」中检索中文或老挝文");

    if (q) {
      html += '<section class="results">' + resultsHTML(collect([cat], q), q) + '</section>';
    } else {
      html += '<section class="results">';
      html += groupHead("全部词条", cat.entries.length);
      html += listBlock("browse", cat.entries.map(function (e) {
        return { z: e[0], l: e[1], f: e[2] || "" };
      }), "");
      html += '</section>';
    }
    view.innerHTML = html;
  }

  function renderNotFound(){
    view.innerHTML = '<div class="empty">' + ICON.empty +
      '<h3>没有这个分类</h3><p>它可能已被移除，请返回分类列表重新进入。</p>' +
      '<p style="margin-top:20px"><a class="back-home" href="#/">' + ICON.back + ' 返回分类词库</a></p></div>';
  }

  /* ---------- 路由 ---------- */
  function parseHash(){
    var raw = location.hash.replace(/^#/, "");
    if (!raw) raw = "/";
    var qi = raw.indexOf("?");
    var path = qi >= 0 ? raw.slice(0, qi) : raw;
    var q = "";
    if (qi >= 0) {
      try {
        q = (new URLSearchParams(raw.slice(qi + 1)).get("q") || "").trim();
      } catch (err) {
        q = "";
      }
    }
    return { path: path, q: q };
  }

  function route(){
    var h = parseHash();
    var cat = null;
    var catId = "";
    if (h.path.indexOf("/c/") === 0) {
      try { catId = decodeURIComponent(h.path.slice(3)); } catch (err) { catId = ""; }
      cat = CATS.filter(function (c) { return c.id === catId; })[0] || null;
    }
    state.q = h.q;
    state.lists = {};

    if (h.path.indexOf("/c/") === 0) {
      if (cat) renderCategory(cat, h.q);
      else renderNotFound();
    } else {
      renderHome(h.q);
    }
    window.scrollTo(0, 0);
  }

  function updateStatic(){
    topMeta.innerHTML = '共 <b>' + fmt(CATS.length) + '</b> 个分类 · <b>' + fmt(totalEntries()) + '</b> 条词条';
    footLeft.textContent = '数据来源：5 份源表逐行收录 · 共 ' + CATS.length + ' 个分类 ' + fmt(totalEntries()) + ' 条词条';
  }

  /* ---------- 交互 ---------- */
  view.addEventListener("submit", function (ev) {
    var form = ev.target.closest("form[data-search]");
    if (!form) return;
    ev.preventDefault();
    var input = form.querySelector('input[name="q"]');
    var q = input ? input.value.trim() : "";
    var mode = form.getAttribute("data-search");
    var base = mode === "global" ? "#/" : "#/c/" + encodeURIComponent(mode);
    var target = base + (q ? "?q=" + encodeURIComponent(q) : "");
    if (location.hash === target) route();
    else location.hash = target;
  });

  view.addEventListener("click", function (ev) {
    var clear = ev.target.closest("[data-clear]");
    if (clear) {
      var form = clear.closest("form");
      var input = form.querySelector('input[name="q"]');
      var mode = form.getAttribute("data-search");
      var base = mode === "global" ? "#/" : "#/c/" + encodeURIComponent(mode);
      if (location.hash === base) route();
      else location.hash = base;
      return;
    }

    var more = ev.target.closest("[data-more]");
    if (more) {
      var key = more.getAttribute("data-more");
      var items = state.lists[key] || [];
      var shown = parseInt(more.getAttribute("data-shown"), 10) || 0;
      var chunk = items.slice(shown, shown + PAGE);
      var box = view.querySelector('[data-list="' + key + '"]');
      if (box && chunk.length) {
        box.insertAdjacentHTML("beforeend", chunk.map(function (it) {
          return cardHTML(it, state.q);
        }).join(""));
        shown += chunk.length;
        more.setAttribute("data-shown", shown);
        if (shown >= items.length) {
          more.parentNode.remove();
        } else {
          more.textContent = "显示更多（还有 " + fmt(items.length - shown) + " 条）";
        }
      }
    }
  });

  window.addEventListener("hashchange", route);

  updateStatic();
  route();
})();
</script>
</body>
</html>
